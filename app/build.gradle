plugins {
    id 'com.android.application'
}

android {
    namespace 'com.parchment.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.parchment.launcher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
